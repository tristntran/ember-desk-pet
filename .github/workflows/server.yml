name: Build server
on:
  push:
    paths: ["server/**", "core/**", ".github/workflows/server.yml"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: aarch64-unknown-linux-gnu, name: aarch64 }       # 64-bit Raspberry Pi OS
          - { target: armv7-unknown-linux-gnueabihf, name: armv7 }     # 32-bit Raspberry Pi OS
          - { target: x86_64-unknown-linux-gnu, name: x86_64 }         # PCs / mini PCs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: taiki-e/install-action@v2
        with: { tool: cross }
      - run: cross build --release -p ember-server --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/ember-server ember-server-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with: { name: "ember-server-${{ matrix.name }}", path: "ember-server-${{ matrix.name }}" }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: "ember-server-${{ matrix.name }}" }
