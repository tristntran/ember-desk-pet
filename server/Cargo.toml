[package]
name = "ember-server"
version = "0.2.0"
edition = "2021"
description = "Ember desk pet home server: serves the screens, LAN-only API, Home Assistant bridge"
license = "MIT"

[dependencies]
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde_json = "1"
ember-core = { path = "../core" }
libc = "0.2"
